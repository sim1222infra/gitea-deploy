services:
  gitea:
    image: gitea/gitea@sha256:30777c91280d973fa02be48b1ade735bd6859e8f6f7af3b4444d519437852504
    restart: always
    networks:
      - cftunnel
    volumes:
      - /mnt/hd1/gitea/:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    # ports:
    #   - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  tunnel:
    image: cloudflare/cloudflared@sha256:0e56c13c7058fcef9c4f0e7d83372f82330548dbf8f8b366f3d8b506526d93b2
    restart: always
    networks:
      - cftunnel
    command: tunnel run --token ${TUNNEL_TOKEN}
  gitea-backup:
    build:
      context: ./backup
    # watchdog コンテナ(backup.sh 参照)からも使うため、固定のタグを付ける
    image: gitea-backup:local
    container_name: gitea-backup
    hostname: dell-server-gitea-backup
    restart: unless-stopped
    env_file:
      # RESTIC_REPOSITORY / RESTIC_PASSWORD / AWS_* (gitignore 済み)
      - ./backup/backup.env
    environment:
      TZ: Asia/Tokyo
      RESTIC_CACHE_DIR: /cache
      # Go の GC を積極的にしてメモリピークを抑える(restic 推奨の省メモリ設定)
      GOGC: 50
      # compose のデフォルト命名 (<プロジェクト名>-<サービス名>-1)
      GITEA_CONTAINER: gitea-gitea-1
      WATCHDOG_IMAGE: gitea-backup:local
    volumes:
      - /mnt/hd1/gitea:/source/gitea:ro
      # /source/gitea と同じ Btrfs 上にあること(reflink コピー先)
      - /mnt/hd1/gitea-backup-staging:/staging
      - restic-cache:/cache
      # Gitea を数秒止めるため
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          memory: 8192m
networks:
  cftunnel:
    enable_ipv6: true
volumes:
  restic-cache:
